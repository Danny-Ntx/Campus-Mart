<!DOCTYPE html>
<html>
<head>
    <title>CampusMart - Post Ad</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="dashboard.html">CampusMart</a>

    <div>
        <a href="dashboard.html" class="btn btn-primary btn-sm">Back</a>
        <a href="index.html" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<!-- FORM SECTION -->
<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-lg p-4">

                <h3 class="text-center mb-3">Post a New Ad</h3>

                <form onsubmit="submitAd(event)">

                    <div class="mb-3">
                        <label class="form-label">Product Title</label>
                        <input type="text" class="form-control" placeholder="e.g iPhone XR" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" class="form-control" placeholder="Enter price" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Condition</label>
                        <select class="form-select">
                            <option>New</option>
                            <option>Used</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-control" placeholder="e.g Abuja">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" rows="3" placeholder="Describe your product"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Upload Image</label>
                        <input type="file" class="form-control">
                    </div>

                    <button class="btn btn-success w-100">Submit Ad</button>

                </form>

            </div>

        </div>

    </div>

</div>

<script>
function submitAd(event) {
    event.preventDefault();

    alert("Ad submitted successfully!");
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
