<!DOCTYPE html>
<html>
<head>
    <title>CampusMart - Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="#">CampusMart</a>

    <form class="d-flex" style="width: 40%;">
        <input class="form-control me-2" type="search" placeholder="Search products...">
        <button class="btn btn-outline-light">Search</button>
    </form>

    <div>
        <a href="post_ad.html" class="btn btn-success btn-sm">Post Ad</a>
        <a href="index.html" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<!-- HEADER TEXT -->
<div class="container mt-4">
    <h3>Welcome to CampusMart 👋</h3>
    <p class="text-muted">Buy and sell items within your campus easily</p>
</div>

<!-- PRODUCTS GRID -->
<div class="container mt-3">
    <div class="row g-3">

        <!-- CARD 1 -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <div style="height:120px; background:#ddd;" class="mb-3">Image</div>
                    <h5>iPhone XR</h5>
                    <p class="text-success">₦150,000</p>
                    <a href="product.html" class="btn btn-primary btn-sm">View</a>
                </div>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <div style="height:120px; background:#ddd;" class="mb-3">Image</div>
                    <h5>Sneakers</h5>
                    <p class="text-success">₦25,000</p>
                    <a href="product.html" class="btn btn-primary btn-sm">View</a>
                </div>
            </div>
        </div>

        <!-- CARD 3 -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <div style="height:120px; background:#ddd;" class="mb-3">Image</div>
                    <h5>Laptop Bag</h5>
                    <p class="text-success">₦10,000</p>
                    <a href="product.html" class="btn btn-primary btn-sm">View</a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
