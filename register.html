<!DOCTYPE html>
<html>
<head>
    <title>CampusMart - Register</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<!-- CENTER CONTAINER -->
<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4" style="width: 380px; border-radius: 15px;">

        <h3 class="text-center mb-1">CampusMart</h3>
        <p class="text-center text-muted">Create your account</p>

        <form onsubmit="registerUser(event)">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" placeholder="Enter full name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Enter email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" class="form-control" placeholder="Enter phone number" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Create password" required>
            </div>

            <div class="mb-3">
                <label class="form-label">User Type</label>
                <select class="form-select">
                    <option value="buyer">Buyer</option>
                    <option value="seller">Seller</option>
                </select>
            </div>

            <button class="btn btn-success w-100">Register</button>

        </form>

        <p class="text-center mt-3">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script>
function registerUser(event) {
    event.preventDefault();
    window.location.href = "login.html";
}
</script>

</body>
</html>
