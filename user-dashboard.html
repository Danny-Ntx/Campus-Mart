<!DOCTYPE html>
<html>
<head>
    <title>CampusMart - My Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="dashboard.html">CampusMart</a>

    <div>
        <a href="post_ad.html" class="btn btn-success btn-sm">Post Ad</a>
        <a href="dashboard.html" class="btn btn-primary btn-sm">Marketplace</a>
        <a href="index.html" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<!-- HEADER -->
<div class="container mt-4">
    <h3>My Dashboard 👤</h3>
    <p class="text-muted">Manage your listings and account</p>
</div>

<!-- STATS ROW -->
<div class="container mt-3">
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card shadow-sm text-center p-3">
                <h5 class="text-muted">Total Listings</h5>
                <h2 class="text-primary">3</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm text-center p-3">
                <h5 class="text-muted">Active</h5>
                <h2 class="text-success">2</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm text-center p-3">
                <h5 class="text-muted">Sold</h5>
                <h2 class="text-secondary">1</h2>
            </div>
        </div>
    </div>
</div>

<!-- MY LISTINGS -->
<div class="container mt-4">
    <h5>My Listings</h5>
    <div class="row g-3">

        <!-- CARD 1 -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <div style="height:120px; background:#ddd;" class="mb-3">Image</div>
                    <h5>iPhone XR</h5>
                    <p class="text-success">₦150,000</p>
                    <span class="badge bg-success">Available</span>
                    <div class="mt-2">
                        <a href="product.html" class="btn btn-primary btn-sm">View</a>
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <div style="height:120px; background:#ddd;" class="mb-3">Image</div>
                    <h5>Table</h5>
                    <p class="text-success">₦25,000</p>
                    <span class="badge bg-secondary">Sold</span>
                    <div class="mt-2">
                        <a href="product.html" class="btn btn-primary btn-sm">View</a>
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- PROFILE SECTION -->
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg p-4">
                <h4 class="text-center mb-3">Profile Settings</h4>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" value="John Doe">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" value="john@student.edu" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" value="08012345678">
                    </div>
                    <button class="btn btn-primary w-100">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
