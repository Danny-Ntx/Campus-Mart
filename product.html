<!DOCTYPE html>
<html>
<head>
    <title>CampusMart - Product</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="dashboard.html">CampusMart</a>

    <div>
        <a href="dashboard.html" class="btn btn-primary btn-sm">Back</a>
        <a href="index.html" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<!-- PRODUCT SECTION -->
<div class="container mt-4">

    <div class="row">

        <!-- IMAGE -->
        <div class="col-md-5">
            <div class="card p-3 shadow-sm">
                <div style="height:300px; background:#ddd; display:flex; align-items:center; justify-content:center;">
                    Product Image
                </div>
            </div>
        </div>

        <!-- DETAILS -->
        <div class="col-md-7">
            <div class="card p-4 shadow-sm">

                <h3>iPhone XR</h3>
                <h4 class="text-success">₦150,000</h4>

                <p><strong>Condition:</strong> Used</p>
                <p><strong>Location:</strong> Abuja</p>
                <p><strong>Seller:</strong> John Doe</p>

                <p>
                    This is a clean iPhone XR in good condition.
                    Works perfectly and has no fault.
                </p>

            </div>
        </div>

    </div>

    <!-- REVIEWS -->
    <div class="card mt-4 p-4 shadow-sm">

        <h4>Reviews</h4>

        <div id="reviewList">
            <p>⭐⭐⭐⭐⭐ - Very good phone</p>
            <p>⭐⭐⭐⭐ - Trusted seller</p>
        </div>

        <hr>

        <h5>Add a Review</h5>

        <form onsubmit="addReview(event)">

            <div class="mb-2">
                <label>Rating (1-5)</label>
                <input type="number" id="rating" class="form-control" min="1" max="5" required>
            </div>

            <div class="mb-2">
                <label>Comment</label>
                <textarea id="comment" class="form-control" required></textarea>
            </div>

            <button class="btn btn-primary">Submit Review</button>

        </form>

    </div>

</div>




</body>
 </html>
